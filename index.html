<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>뀨 가족 포트폴리오</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   CSS 변수 & 리셋
═══════════════════════════════════════ */
:root {
  --bg:       #0d1117;
  --s1:       #161b22;
  --s2:       #1c2730;
  --s3:       #243040;
  --border:   #2a3a4a;
  --text:     #e2e8f0;
  --dim:      #b0bec5;
  --muted:    #6b7f90;
  --blue:     #3b82f6;
  --cyan:     #06b6d4;
  --green:    #10b981;
  --red:      #ef4444;
  --yellow:   #f59e0b;
  --purple:   #8b5cf6;
  --orange:   #f97316;
  --font-kr:  'Noto Sans KR', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
  --radius:   10px;
  --shadow:   0 4px 20px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--font-kr);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
button{font-family:var(--font-kr);cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:var(--font-kr);background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:13px;outline:none;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--blue);}
select option{background:var(--s2);}

/* ═══════════════════════════════════════
   레이아웃
═══════════════════════════════════════ */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* 헤더 */
.app-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;height:52px;
  background:var(--s1);border-bottom:1px solid var(--border);
  flex-shrink:0;gap:8px;
}
.app-header-left{display:flex;align-items:center;gap:10px;min-width:0;}
.app-title{font-size:16px;font-weight:900;color:var(--text);white-space:nowrap;}
.app-date{font-size:11px;color:var(--muted);font-family:var(--font-mono);}
.header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}

/* 버튼 공통 */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;font-size:12px;font-weight:700;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:#2563eb;}
.btn-success{background:var(--green);color:#fff;}
.btn-success:hover{background:#059669;}
.btn-secondary{background:var(--s3);color:var(--dim);border:1px solid var(--border);}
.btn-secondary:hover{background:var(--border);color:var(--text);}
.btn-danger{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.btn-danger:hover{background:rgba(239,68,68,.22);}

/* 관리 드롭다운 */
.mgmt-wrap{position:relative;}
.mgmt-menu{
  display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:200;
  background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);min-width:160px;overflow:hidden;
}
.mgmt-menu.open{display:block;}
.mgmt-item{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12px;color:var(--dim);cursor:pointer;transition:background .1s;}
.mgmt-item:hover{background:var(--s2);color:var(--text);}
.mgmt-item.danger{color:var(--red);}
.mgmt-sep{height:1px;background:var(--border);margin:3px 0;}

/* 탭 네비게이션 */
.tab-nav{
  display:flex;align-items:center;gap:0;
  background:var(--s1);border-bottom:1px solid var(--border);
  flex-shrink:0;padding:0 16px;
}
.tab-btn{
  padding:12px 18px;font-size:13px;font-weight:700;color:var(--muted);
  background:none;border-bottom:2px solid transparent;transition:all .15s;
  white-space:nowrap;
}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);}
.tab-btn:hover:not(.active){color:var(--dim);}

/* 메인 콘텐츠 영역 */
.app-body{flex:1;overflow-y:auto;background:var(--bg);}
.tab-panel{display:none;padding:20px 16px;max-width:900px;margin:0 auto;}
.tab-panel.active{display:block;}

/* ═══════════════════════════════════════
   공통 카드
═══════════════════════════════════════ */
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);}
.card-head h3{font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;}
.card-body{padding:14px;}

.sec-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* ═══════════════════════════════════════
   탭1 — 이번 주 입력
═══════════════════════════════════════ */
.meta-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.meta-item{display:flex;align-items:center;gap:8px;}
.meta-item label{font-size:12px;color:var(--muted);white-space:nowrap;}
.meta-item input{width:140px;}

/* 구성원 카드 */
.member-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
.member-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;cursor:pointer;transition:background .1s;
  user-select:none;
}
.member-head:hover{background:var(--s2);}
.member-head-left{display:flex;align-items:center;gap:10px;}
.member-icon{font-size:20px;}
.member-info{}
.member-name{font-size:14px;font-weight:700;}
.member-role{font-size:11px;color:var(--muted);}
.member-head-right{display:flex;align-items:center;gap:12px;}
.member-total{font-size:18px;font-weight:700;font-family:var(--font-mono);color:var(--cyan);}
.member-total .unit{font-size:12px;color:var(--muted);}
.member-chevron{font-size:10px;color:var(--muted);transition:transform .2s;}
.member-card.collapsed .member-chevron{transform:rotate(-90deg);}
.member-body{padding:12px 14px;border-top:1px solid var(--border);}
.member-card.collapsed .member-body{display:none;}

/* 보유 종목 테이블 */
.holdings-wrap{overflow-x:auto;margin-bottom:8px;}
.holdings-table{width:100%;border-collapse:collapse;min-width:560px;}
.holdings-table th{
  font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;padding:5px 6px;text-align:left;
  background:var(--s2);border-bottom:1px solid var(--border);
  white-space:nowrap;
}
.holdings-table td{
  padding:4px 5px;vertical-align:middle;border-bottom:1px solid rgba(42,58,74,.5);
}
.holdings-table tbody tr:last-child td{border-bottom:none;}
.holdings-table tbody tr:hover td{background:rgba(255,255,255,.03);}
.holdings-table input{
  width:100%;padding:4px 6px;font-size:12px;background:transparent;
  border:1px solid transparent;border-radius:4px;
}
.holdings-table input:focus{background:var(--s2);border-color:var(--blue);}
.holdings-table select{
  width:100%;padding:3px 4px;font-size:11px;background:var(--s2);
  border:1px solid var(--border);
}
.pnl-input{font-family:var(--font-mono);}
.pnl-pos{color:var(--green) !important;}
.pnl-neg{color:var(--red) !important;}
.amount-input{font-family:var(--font-mono);text-align:right;}
.row-btn{
  background:none;border:none;color:var(--muted);font-size:14px;
  cursor:pointer;padding:2px 4px;border-radius:3px;transition:color .1s;
}
.row-btn:hover{color:var(--red);}
.row-btn.copy:hover{color:var(--cyan);}
.add-row-btn{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
  background:none;border:1px dashed var(--border);border-radius:6px;
  padding:6px 12px;width:100%;justify-content:center;
  transition:all .15s;margin-bottom:6px;
}
.add-row-btn:hover{color:var(--cyan);border-color:var(--cyan);}

/* 소계 표시 */
.member-subtotal{
  display:flex;justify-content:flex-end;align-items:center;gap:8px;
  font-size:12px;color:var(--muted);padding:4px 0;
}
.member-subtotal strong{font-family:var(--font-mono);font-size:14px;color:var(--cyan);}

/* 주간 메모 */
.memo-area{
  width:100%;min-height:80px;resize:vertical;
  background:var(--s2);border:1px solid var(--border);border-radius:6px;
  color:var(--text);padding:10px;font-size:13px;line-height:1.6;
}
.action-list{list-style:none;padding:0;}
.action-list li{
  display:flex;align-items:center;gap:8px;margin-bottom:6px;
}
.action-list li input[type=text]{flex:1;}
.action-remove{color:var(--red);background:none;border:none;font-size:16px;cursor:pointer;padding:0 4px;line-height:1;}

/* 추가매수/매도 입력 */
.cashflow-row{display:flex;gap:10px;flex-wrap:wrap;}
.cashflow-item{flex:1;min-width:140px;}
.cashflow-item label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
.cashflow-item input{width:100%;}

/* ═══════════════════════════════════════
   탭2 — 현황 확인
═══════════════════════════════════════ */
.summary-banner{
  background:linear-gradient(135deg,var(--s1) 0%,var(--s2) 100%);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;margin-bottom:14px;
  display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;
}
.banner-total{}
.banner-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.banner-amount{font-size:32px;font-weight:900;font-family:var(--font-mono);color:var(--text);}
.banner-amount .unit{font-size:16px;color:var(--muted);}
.banner-change{display:flex;align-items:center;gap:6px;margin-top:4px;}
.change-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700;font-family:var(--font-mono);
}
.change-badge.up{background:rgba(16,185,129,.15);color:var(--green);}
.change-badge.down{background:rgba(239,68,68,.15);color:var(--red);}
.change-badge.flat{background:rgba(107,127,144,.15);color:var(--muted);}
.banner-meta{font-size:11px;color:var(--muted);}

/* 구성원 카드 그리드 */
.member-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px;}
.stat-card{
  background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;
}
.stat-card-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.stat-card-icon{font-size:18px;}
.stat-card-name{font-size:13px;font-weight:700;}
.stat-card-amount{font-size:22px;font-weight:700;font-family:var(--font-mono);margin-bottom:4px;}
.stat-card-amount .unit{font-size:12px;color:var(--muted);}
.stat-card-change{font-size:12px;font-weight:700;font-family:var(--font-mono);}
.stat-card-change.up{color:var(--green);}
.stat-card-change.down{color:var(--red);}
.stat-card-change.flat{color:var(--muted);}
.stat-card-top{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* 종목 순위 차트 */
.ticker-chart{margin-bottom:6px;}
.ticker-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.ticker-rank{width:18px;font-size:11px;color:var(--muted);font-family:var(--font-mono);text-align:right;flex-shrink:0;}
.ticker-name{width:140px;font-size:12px;font-weight:700;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ticker-bar-wrap{flex:1;height:8px;background:var(--s3);border-radius:4px;overflow:hidden;}
.ticker-bar{height:100%;border-radius:4px;background:var(--blue);transition:width .4s ease;}
.ticker-amount{width:72px;text-align:right;font-size:11px;font-family:var(--font-mono);color:var(--dim);flex-shrink:0;}
.ticker-pct{width:40px;text-align:right;font-size:11px;color:var(--muted);flex-shrink:0;}
.ticker-owners{font-size:10px;color:var(--muted);margin-bottom:2px;}

/* 자산 분류 바 */
.cat-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.cat-bar-label{width:88px;font-size:12px;color:var(--dim);flex-shrink:0;}
.cat-bar-wrap{flex:1;height:10px;background:var(--s3);border-radius:5px;overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:5px;}
.cat-bar-pct{width:36px;text-align:right;font-size:11px;font-family:var(--font-mono);color:var(--muted);}
.cat-bar-amt{width:64px;text-align:right;font-size:11px;font-family:var(--font-mono);color:var(--muted);}

/* ═══════════════════════════════════════
   탭3 — 기록 보기
═══════════════════════════════════════ */
.trend-chart-wrap{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.trend-svg{width:100%;overflow:visible;}
.trend-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.trend-row:last-child{border-bottom:none;}
.trend-date{width:80px;font-size:11px;font-family:var(--font-mono);color:var(--muted);}
.trend-total{flex:1;font-size:13px;font-weight:700;font-family:var(--font-mono);}
.trend-change{width:90px;text-align:right;font-size:12px;font-family:var(--font-mono);}
.trend-change.up{color:var(--green);}
.trend-change.down{color:var(--red);}
.trend-del{color:var(--red);background:none;border:none;cursor:pointer;font-size:12px;padding:2px 6px;border-radius:4px;}
.trend-del:hover{background:rgba(239,68,68,.1);}

/* 구글시트 패널 */
.gs-panel{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.gs-url-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.gs-url-row input{flex:1;font-size:11px;font-family:var(--font-mono);}
.gs-status{font-size:11px;color:var(--muted);font-family:var(--font-mono);word-break:break-all;}
.gs-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}

/* ═══════════════════════════════════════
   토스트
═══════════════════════════════════════ */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--s3);border:1px solid var(--border);border-radius:8px;
  padding:10px 18px;font-size:13px;color:var(--text);
  box-shadow:var(--shadow);z-index:9999;
  transition:transform .25s ease,opacity .25s ease;opacity:0;pointer-events:none;
  white-space:nowrap;max-width:90vw;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* ═══════════════════════════════════════
   저장 상태 표시
═══════════════════════════════════════ */
.save-dot{
  width:6px;height:6px;border-radius:50%;background:var(--green);
  display:inline-block;margin-right:4px;
  animation:blink 2s infinite;
}
.save-dot.dirty{background:var(--yellow);animation:none;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ═══════════════════════════════════════
   반응형
═══════════════════════════════════════ */
@media(max-width:600px){
  .app-title{font-size:14px;}
  .tab-btn{padding:10px 12px;font-size:12px;}
  .banner-amount{font-size:24px;}
  .member-cards-grid{grid-template-columns:1fr 1fr;}
  .ticker-name{width:100px;}
}
@media(max-width:400px){
  .member-cards-grid{grid-template-columns:1fr;}
  .tab-btn{padding:10px 8px;font-size:11px;}
}

/* ═══════════════════════════════════════
   배지
═══════════════════════════════════════ */
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;}
.badge-new{background:rgba(59,130,246,.2);color:var(--blue);}
.badge-hold{background:rgba(107,127,144,.2);color:var(--muted);}
.badge-sell{background:rgba(239,68,68,.2);color:var(--red);}
.badge-watch{background:rgba(245,158,11,.2);color:var(--yellow);}
</style>
</head>
<body>
<div class="app">

  <!-- ── 헤더 ── -->
  <header class="app-header">
    <div class="app-header-left">
      <span style="font-size:20px">📊</span>
      <div>
        <div class="app-title">뀨 가족 포트폴리오</div>
        <div class="app-date" id="headerDate">—</div>
      </div>
    </div>
    <div class="header-actions">
      <span id="saveDot" class="save-dot" title="자동저장 활성"></span>
      <button class="btn btn-success" onclick="doWeeklySave()">📸 이번 주 저장</button>
      <button class="btn btn-primary" onclick="generateReport()">⬇️ 보고서 생성</button>
      <div class="mgmt-wrap">
        <button class="btn btn-secondary" onclick="toggleMgmt(event)">⚙️ 관리 ▾</button>
        <div class="mgmt-menu" id="mgmtMenu">
          <div class="mgmt-item" onclick="saveJSON();closeMgmt()">💾 JSON 저장 (백업)</div>
          <label class="mgmt-item" style="cursor:pointer">
            📂 JSON 불러오기
            <input type="file" accept=".json" style="display:none" onchange="loadJSON(event);closeMgmt()">
          </label>
          <div class="mgmt-sep"></div>
          <div class="mgmt-item" onclick="openGSPanel();closeMgmt()">🧾 구글시트 설정</div>
          <div class="mgmt-sep"></div>
          <div class="mgmt-item danger" onclick="confirmReset();closeMgmt()">↺ 초기화</div>
        </div>
      </div>
    </div>
  </header>

  <!-- ── 탭 네비게이션 ── -->
  <nav class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('input',this)">📝 이번 주 입력</button>
    <button class="tab-btn" onclick="switchTab('status',this)">📊 현황 확인</button>
    <button class="tab-btn" onclick="switchTab('history',this)">📈 기록 보기</button>
  </nav>

  <!-- ── 메인 ── -->
  <main class="app-body">

    <!-- ────────────────────────────────
         탭1: 이번 주 입력
    ──────────────────────────────── -->
    <div class="tab-panel active" id="tab-input">

      <!-- 기준일 & 기본 정보 -->
      <div class="card">
        <div class="card-head"><h3>📅 기준일 설정</h3></div>
        <div class="card-body">
          <div class="meta-row">
            <div class="meta-item">
              <label>기준일</label>
              <input type="text" id="metaDate" placeholder="2026.05.31" oninput="onMetaDateChange(this.value)">
            </div>
            <div class="meta-item" style="flex:1;min-width:180px;">
              <label>이번 주 추가매수</label>
              <input type="number" id="weeklyBuy" min="0" step="10" placeholder="0" oninput="onWeeklyFlowChange()"> <span style="font-size:11px;color:var(--muted)">만원</span>
            </div>
            <div class="meta-item" style="flex:1;min-width:180px;">
              <label>이번 주 매도/인출</label>
              <input type="number" id="weeklySell" min="0" step="10" placeholder="0" oninput="onWeeklyFlowChange()"> <span style="font-size:11px;color:var(--muted)">만원</span>
            </div>
          </div>
          <div style="font-size:11px;color:var(--muted);line-height:1.6;">
            ※ 추가매수/매도 입력 시 "순수 수익 변화"를 보고서에서 구분해 표시합니다.
          </div>
        </div>
      </div>

      <!-- 구성원별 보유 현황 -->
      <div class="sec-label">👨‍👩‍👧‍👦 가족 구성원 보유 현황</div>
      <div id="membersContainer"></div>

      <!-- 주간 메모 & 행동 지침 -->
      <div class="card">
        <div class="card-head"><h3>📝 이번 주 가족에게 전할 말</h3></div>
        <div class="card-body">
          <div style="margin-bottom:12px;">
            <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">한 줄 결론 (가족이 가장 먼저 보는 문장)</div>
            <textarea class="memo-area" id="weeklyMemo" rows="3"
              placeholder="이번 주는 AI·반도체 쪽으로 돈이 더 몰렸어요. 현금은 유지 중이라 급하게 바꿀 필요 없어요."
              oninput="onMemoChange(this.value)"></textarea>
          </div>
          <div>
            <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">이번 주 행동 지침 (가족이 알아야 할 것들)</div>
            <ul class="action-list" id="actionList"></ul>
            <button class="add-row-btn" onclick="addAction()">+ 지침 추가</button>
          </div>
        </div>
      </div>

    </div><!-- /tab-input -->

    <!-- ────────────────────────────────
         탭2: 현황 확인
    ──────────────────────────────── -->
    <div class="tab-panel" id="tab-status">
      <div id="statusContent">
        <div style="text-align:center;padding:40px;color:var(--muted);">탭을 클릭하면 최신 상태로 불러옵니다.</div>
      </div>
    </div>

    <!-- ────────────────────────────────
         탭3: 기록 보기
    ──────────────────────────────── -->
    <div class="tab-panel" id="tab-history">
      <div id="historyContent">
        <div style="text-align:center;padding:40px;color:var(--muted);">탭을 클릭하면 최신 상태로 불러옵니다.</div>
      </div>
    </div>

  </main>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script>
'use strict';
// ════════════════════════════════════════════════════════
//  상수 & 스토리지 키 (기존 앱과 완전 동일)
// ════════════════════════════════════════════════════════
const STATE_KEY              = 'pfeditor_v8_state';
const LEGACY_STATE_KEYS      = ['pfeditor_v7_state','pfeditor_v6_state'];
const SNAPSHOT_KEY           = 'pfeditor_v8_snapshot';
const TREND_KEY              = 'pf_monthly_snapshots';
const GOOGLE_SHEET_URL_KEY   = 'pf_google_apps_script_url';

const CATEGORIES = [
  { id:'core',     label:'코어 ETF',      color:'#3b82f6' },
  { id:'bigtech',  label:'빅테크·플랫폼', color:'#8b5cf6' },
  { id:'ai',       label:'AI·반도체',     color:'#ef4444' },
  { id:'semi',     label:'반도체 ETF',    color:'#f59e0b' },
  { id:'defense',  label:'방어·현금',     color:'#10b981' },
  { id:'growth',   label:'성장·테마',     color:'#f97316' },
  { id:'domestic', label:'국내·기타ETF',  color:'#06b6d4' },
  { id:'other',    label:'기타',          color:'#94a3b8' },
];
const CAT_MAP = Object.fromEntries(CATEGORIES.map(c=>[c.id,c]));

const ENTRY_TYPES = [
  {v:'single',l:'단일종목'},{v:'basket',l:'묶음/ETF'},{v:'cash',l:'현금/예치'}
];

const BADGE_OPTIONS = [
  {v:'',l:'없음'},{v:'신규',l:'신규'},{v:'보유',l:'보유'},
  {v:'관찰중',l:'관찰중'},{v:'매도검토',l:'매도검토'}
];

// ════════════════════════════════════════════════════════
//  기본 State
// ════════════════════════════════════════════════════════
function makeDefaultState() {
  return {
    meta:{ date:'', weeklyBuy:0, weeklySell:0, weeklyMemo:'', actions:[] },
    catTargets:{ core:35,bigtech:22,ai:21,semi:10,defense:10,growth:0,domestic:0,other:2 },
    members:[
      { id:'hyunkyu',  name:'이현규', icon:'⚡', role:'전술·현금·기회포착',   color:'#3b82f6', holdings:[] },
      { id:'insuk',    name:'임인숙', icon:'🛡', role:'코어 장기복리·은퇴축', color:'#8b5cf6', holdings:[] },
      { id:'jaehyun',  name:'이재현', icon:'🚀', role:'공격 성장 엔진',       color:'#10b981', holdings:[] },
      { id:'jaeyeon',  name:'이재연', icon:'✨', role:'성장 + 구조개선',      color:'#f97316', holdings:[] },
    ],
    planConfig:null
  };
}

let state = makeDefaultState();
let snapshot = null;
let _dirty = false;
let _autoSaveTimer = null;
let _currentTab = 'input';

// ════════════════════════════════════════════════════════
//  유틸
// ════════════════════════════════════════════════════════
function toNum(v,fb=0){ const n=parseFloat(String(v).replace(/,/g,'')); return isNaN(n)?fb:n; }
function fmt(n){ return Math.round(n).toLocaleString('ko-KR'); }
function fmtSign(n){
  const r=Math.round(n);
  return (r>0?'+':'')+r.toLocaleString('ko-KR');
}
function cloneState(o){ return JSON.parse(JSON.stringify(o)); }

function normalizeTicker(t){
  if(!t) return '';
  return t.trim().toUpperCase();
}

function normalizeDateKey(v){
  if(!v) return '';
  const s = String(v).replace(/\./g,'-');
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if(/^\d{4}-\d{2}$/.test(s)) return s+'-01';
  return s;
}

// ════════════════════════════════════════════════════════
//  State 계산
// ════════════════════════════════════════════════════════
function calcState() {
  const memberTotals = state.members.map(m =>
    m.holdings.reduce((s,h) => s + toNum(h.amount), 0)
  );
  const grandTotal = memberTotals.reduce((a,b)=>a+b,0);

  // 카테고리별 합계
  const catTotals = {};
  CATEGORIES.forEach(c=>{ catTotals[c.id]=0; });
  state.members.forEach(m => m.holdings.forEach(h => {
    if(CAT_MAP[h.cat]) catTotals[h.cat] += toNum(h.amount);
  }));
  const catPcts = {};
  CATEGORIES.forEach(c=>{ catPcts[c.id] = grandTotal>0 ? catTotals[c.id]/grandTotal*100 : 0; });

  // 종목별 합산 (가족 전체)
  const tickerMap = {};
  state.members.forEach((m,mi) => m.holdings.forEach(h => {
    const t = normalizeTicker(h.ticker);
    if(!t || h.entryType==='cash') return;
    if(!tickerMap[t]) tickerMap[t] = { ticker:t, amount:0, members:[], entryType:h.entryType };
    tickerMap[t].amount += toNum(h.amount);
    if(!tickerMap[t].members.includes(m.name)) tickerMap[t].members.push(m.name);
  }));
  const tickerList = Object.values(tickerMap)
    .sort((a,b)=>b.amount-a.amount)
    .map(t=>({ ...t, pct: grandTotal>0 ? t.amount/grandTotal*100 : 0 }));

  return { memberTotals, grandTotal, catTotals, catPcts, tickerList };
}

// ════════════════════════════════════════════════════════
//  State 저장 / 불러오기
// ════════════════════════════════════════════════════════
function saveStateNow(){
  try{ localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch(e){}
  if(snapshot) try{ localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(snapshot)); }catch(e){}
}

function markDirty(){
  _dirty=true;
  document.getElementById('saveDot').className='save-dot dirty';
  clearTimeout(_autoSaveTimer);
  _autoSaveTimer=setTimeout(()=>{ saveStateNow(); markClean(); }, 1500);
}

function markClean(msg){
  _dirty=false;
  document.getElementById('saveDot').className='save-dot';
  if(msg) showToast(msg);
}

function applyStateMigrations(ns){
  if(!ns||!Array.isArray(ns.members)) throw new Error('invalid state');
  const def = makeDefaultState();
  ns.meta = Object.assign({}, def.meta, ns.meta||{});
  // 하위호환: 구버전에 없던 필드 기본값
  if(ns.meta.weeklyBuy===undefined) ns.meta.weeklyBuy=0;
  if(ns.meta.weeklySell===undefined) ns.meta.weeklySell=0;
  if(ns.meta.actions===undefined) ns.meta.actions=[];
  ns.catTargets = Object.assign({}, def.catTargets, ns.catTargets||{});
  ns.members.forEach((m,mi)=>{
    m.id = m.id||('m'+mi);
    m.name = String(m.name||`구성원${mi+1}`);
    m.icon = String(m.icon||'👤');
    m.role = String(m.role||'');
    m.color = m.color||def.members[mi]?.color||'#06b6d4';
    m.holdings = Array.isArray(m.holdings)?m.holdings:[];
    m.holdings.forEach(h=>{
      h.account = String(h.account||'');
      h.ticker  = String(h.ticker||'');
      h.qty     = String(h.qty||'');
      h.pnl     = String(h.pnl||'');
      h.entryType = ENTRY_TYPES.find(t=>t.v===h.entryType)?h.entryType:'single';
      h.cat     = CAT_MAP[h.cat]?h.cat:'other';
      h.amount  = toNum(h.amount);
      h.badge   = String(h.badge||'');
      h.note    = String(h.note||'');
    });
  });
  return ns;
}

function restoreSavedState(){
  const keys = [STATE_KEY, ...LEGACY_STATE_KEYS];
  for(const k of keys){
    try{
      const raw = localStorage.getItem(k);
      if(!raw) continue;
      const parsed = JSON.parse(raw);
      state = applyStateMigrations(parsed);
      if(k!==STATE_KEY) saveStateNow();
      return true;
    }catch(e){}
  }
  return false;
}

function restoreSavedSnapshot(){
  try{
    const raw = localStorage.getItem(SNAPSHOT_KEY);
    if(!raw) return false;
    snapshot = JSON.parse(raw);
    return true;
  }catch(e){ return false; }
}

// ════════════════════════════════════════════════════════
//  스냅샷
// ════════════════════════════════════════════════════════
function buildSnapshotEntry(){
  const calc = calcState();
  const dateVal = state.meta.date || new Date().toISOString().slice(0,10).replace(/-/g,'.');
  const ym = normalizeDateKey(dateVal);
  const tickers = {};
  state.members.forEach(m => m.holdings.forEach(h=>{
    const t=(h.ticker||'').trim();
    if(!t||h.entryType==='cash') return;
    tickers[t]=(tickers[t]||0)+toNum(h.amount);
  }));
  return {
    ym, label:dateVal, savedAt:new Date().toISOString(),
    grandTotal:calc.grandTotal,
    catTotals:calc.catTotals, catPcts:calc.catPcts,
    members: state.members.map((m,mi)=>({ name:m.name, icon:m.icon, total:calc.memberTotals[mi] })),
    tickers,
    weeklyBuy:  toNum(state.meta.weeklyBuy),
    weeklySell: toNum(state.meta.weeklySell),
    weeklyMemo: state.meta.weeklyMemo||'',
    actions:    state.meta.actions||[],
    state: cloneState(state)
  };
}

function normalizeTrendSnapshot(s){
  if(!s||typeof s!=='object') return null;
  const ym = normalizeDateKey(s.ym||s.label||s.date);
  const label = s.label||ym;
  return Object.assign({},s,{
    ym, label,
    grandTotal: toNum(s.grandTotal),
    members: Array.isArray(s.members)?s.members.map(m=>({
      name:String(m.name||''), icon:String(m.icon||''), total:toNum(m.total)
    })):[],
    tickers: s.tickers&&typeof s.tickers==='object'?Object.fromEntries(
      Object.entries(s.tickers).map(([k,v])=>[String(k),toNum(v)])
    ):{}
  });
}

function loadTrendSnapshots(){
  try{
    const raw = JSON.parse(localStorage.getItem(TREND_KEY)||'[]');
    const migrated = raw.map(normalizeTrendSnapshot).filter(Boolean);
    const deduped = {};
    migrated.forEach(s=>{ deduped[s.ym]=s; });
    const sorted = Object.values(deduped).sort((a,b)=>a.ym.localeCompare(b.ym));
    return sorted;
  }catch(e){ return []; }
}

function upsertTrendSnapshot(entry){
  if(!entry||!entry.ym) return;
  const snaps = loadTrendSnapshots();
  const idx = snaps.findIndex(s=>s.ym===entry.ym);
  if(idx>=0) snaps[idx]=entry; else snaps.push(entry);
  snaps.sort((a,b)=>a.ym.localeCompare(b.ym));
  try{ localStorage.setItem(TREND_KEY, JSON.stringify(snaps)); }catch(e){}
}

// ════════════════════════════════════════════════════════
//  📸 이번 주 저장 (통합 버튼)
// ════════════════════════════════════════════════════════
function doWeeklySave(){
  if(!state.meta.date){
    showToast('❌ 기준일을 먼저 입력해주세요');
    return;
  }
  // 1) 비교점 저장 (snapshot)
  const calc = calcState();
  snapshot = {
    date: state.meta.date,
    grandTotal: calc.grandTotal,
    catPcts: {...calc.catPcts},
    tickerList: calc.tickerList.map(t=>({ticker:t.ticker,amount:t.amount,entryType:t.entryType,pct:t.pct}))
  };
  localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(snapshot));

  // 2) 날짜별 기록 저장
  const entry = buildSnapshotEntry();
  upsertTrendSnapshot(entry);

  // 3) 구글시트 백업
  const gsUrl = getGSUrl();
  if(gsUrl){
    showToast('📸 저장 완료 — 구글시트 전송 중...');
    postToGoogleSheet({ mode:'single', snapshots:[entry] });
  } else {
    showToast('📸 저장 완료 (구글시트 URL 미설정)');
  }

  saveStateNow();
  markClean();

  // 현황 탭도 갱신 예약
  if(_currentTab==='status') renderStatusTab();
  if(_currentTab==='history') renderHistoryTab();
}

// ════════════════════════════════════════════════════════
//  구글시트 연동
// ════════════════════════════════════════════════════════
function getGSUrl(){ return (localStorage.getItem(GOOGLE_SHEET_URL_KEY)||'').trim(); }
function setGSUrl(url){ localStorage.setItem(GOOGLE_SHEET_URL_KEY, (url||'').trim()); }

function postToGoogleSheet(payload){
  const url = getGSUrl();
  if(!url) return;
  fetch(url,{
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ action:'save', payload })
  }).then(()=>{ showToast('🧾 구글시트 전송 완료'); })
    .catch(e=>{ showToast('❌ 구글시트 전송 실패: '+(e.message||e)); });
}

async function loadFromGoogleSheet(limit=20){
  const url = getGSUrl();
  if(!url){ showToast('구글시트 URL이 설정되지 않았습니다'); return; }
  showToast('구글시트에서 불러오는 중...');
  try{
    const res = await fetch(url+'?action=list&limit='+limit+'&_='+Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const snaps = Array.isArray(data)?data:(data.snapshots||[]);
    if(!snaps.length){ showToast('가져올 기록이 없습니다'); return; }
    const existing = loadTrendSnapshots();
    const mm = {};
    existing.forEach(s=>{ mm[s.ym]=s; });
    snaps.map(normalizeTrendSnapshot).filter(Boolean).forEach(s=>{ mm[s.ym]=s; });
    const merged = Object.values(mm).sort((a,b)=>a.ym.localeCompare(b.ym));
    localStorage.setItem(TREND_KEY, JSON.stringify(merged));
    showToast('✅ 구글시트에서 '+snaps.length+'건 불러오기 완료');
    if(_currentTab==='history') renderHistoryTab();
  }catch(e){
    showToast('❌ 불러오기 실패: '+(e.message||e));
  }
}

// ════════════════════════════════════════════════════════
//  JSON 저장 / 불러오기
// ════════════════════════════════════════════════════════
function saveJSON(){
  upsertTrendSnapshot(buildSnapshotEntry());
  const trendSnapshots = loadTrendSnapshots();
  const data = Object.assign({}, state, { trendSnapshots });
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const ymd = (state.meta.date||new Date().toISOString().slice(0,10)).replace(/\./g,'-').slice(0,10);
  a.download = 'portfolio_'+ymd+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  showToast('✅ JSON 저장 완료 — '+trendSnapshots.length+'주 포함');
}

function loadJSON(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const loaded = JSON.parse(e.target.result);
      if(Array.isArray(loaded.trendSnapshots)&&loaded.trendSnapshots.length>0){
        const existing = loadTrendSnapshots();
        const mm={};
        existing.forEach(s=>{ mm[s.ym]=s; });
        loaded.trendSnapshots.forEach(s=>{
          const ns = normalizeTrendSnapshot(s);
          if(ns) mm[ns.ym]=ns;
        });
        const merged=Object.values(mm).sort((a,b)=>a.ym.localeCompare(b.ym));
        localStorage.setItem(TREND_KEY,JSON.stringify(merged));
      }
      const {trendSnapshots:_ig,...stateOnly}=loaded;
      state = applyStateMigrations(stateOnly);
      saveStateNow();
      syncMetaInputs();
      renderMembers();
      showToast('✅ JSON 불러오기 완료');
    }catch(err){
      showToast('❌ JSON 파일 오류: '+err.message);
    }
  };
  reader.readAsText(file);
  event.target.value='';
}

// ════════════════════════════════════════════════════════
//  초기화
// ════════════════════════════════════════════════════════
function confirmReset(){
  if(!confirm('정말 초기화하시겠습니까?\n저장된 편집 내용이 삭제됩니다.\n(날짜별 기록은 유지됩니다)')) return;
  if(!confirm('한 번 더 확인합니다. 편집 내용을 초기화할까요?')) return;
  state = makeDefaultState();
  saveStateNow();
  syncMetaInputs();
  renderMembers();
  showToast('↺ 초기화 완료 (날짜별 기록은 유지)');
}

// ════════════════════════════════════════════════════════
//  탭 전환
// ════════════════════════════════════════════════════════
function switchTab(tab, btn){
  _currentTab=tab;
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  if(btn) btn.classList.add('active');
  if(tab==='status') renderStatusTab();
  if(tab==='history') renderHistoryTab();
}

// ════════════════════════════════════════════════════════
//  META 입력 동기화
// ════════════════════════════════════════════════════════
function syncMetaInputs(){
  const di = document.getElementById('metaDate');
  if(di) di.value = state.meta.date||'';
  const bi = document.getElementById('weeklyBuy');
  if(bi) bi.value = state.meta.weeklyBuy||'';
  const si = document.getElementById('weeklySell');
  if(si) si.value = state.meta.weeklySell||'';
  const mi = document.getElementById('weeklyMemo');
  if(mi) mi.value = state.meta.weeklyMemo||'';
  renderActions();
  document.getElementById('headerDate').textContent =
    state.meta.date ? state.meta.date+' 기준' : '기준일 미입력';
}

function onMetaDateChange(v){
  state.meta.date=v;
  document.getElementById('headerDate').textContent = v ? v+' 기준' : '기준일 미입력';
  markDirty();
}
function onWeeklyFlowChange(){
  state.meta.weeklyBuy  = toNum(document.getElementById('weeklyBuy').value);
  state.meta.weeklySell = toNum(document.getElementById('weeklySell').value);
  markDirty();
}
function onMemoChange(v){ state.meta.weeklyMemo=v; markDirty(); }

// ════════════════════════════════════════════════════════
//  행동 지침
// ════════════════════════════════════════════════════════
function renderActions(){
  const ul = document.getElementById('actionList');
  if(!ul) return;
  if(!Array.isArray(state.meta.actions)) state.meta.actions=[];
  ul.innerHTML = state.meta.actions.map((a,i)=>`
    <li>
      <span style="color:var(--muted);font-size:14px">•</span>
      <input type="text" value="${escH(a)}" placeholder="예: AI·반도체 추가매수는 이번 주 쉬기"
        oninput="updateAction(${i},this.value)">
      <button class="action-remove" onclick="removeAction(${i})">×</button>
    </li>
  `).join('');
}
function addAction(){
  if(!Array.isArray(state.meta.actions)) state.meta.actions=[];
  state.meta.actions.push('');
  renderActions();
  // 포커스
  const inputs=document.querySelectorAll('#actionList input');
  if(inputs.length) inputs[inputs.length-1].focus();
  markDirty();
}
function updateAction(i,v){ state.meta.actions[i]=v; markDirty(); }
function removeAction(i){ state.meta.actions.splice(i,1); renderActions(); markDirty(); }

// ════════════════════════════════════════════════════════
//  구성원 렌더링
// ════════════════════════════════════════════════════════
function escH(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderMembers(){
  const container = document.getElementById('membersContainer');
  if(!container) return;
  container.innerHTML='';
  state.members.forEach((m,mi)=>{ renderMember(m,mi,container); });
  recalcSubtotals();
}

function renderMember(m,mi,container){
  const div = document.createElement('div');
  div.className='member-card';
  div.id='member-card-'+mi;

  // 보유 종목 행 생성
  const rows = m.holdings.map((h,hi)=>buildHoldingRow(mi,hi,h)).join('');

  div.innerHTML=`
    <div class="member-head" onclick="toggleMember(${mi})">
      <div class="member-head-left">
        <span class="member-icon">${escH(m.icon)}</span>
        <div class="member-info">
          <div class="member-name">${escH(m.name)}</div>
          <div class="member-role">${escH(m.role)}</div>
        </div>
      </div>
      <div class="member-head-right">
        <div class="member-total" id="mtotal-${mi}"><span class="unit">계산 중</span></div>
        <span class="member-chevron">▼</span>
      </div>
    </div>
    <div class="member-body">
      <div class="holdings-wrap">
        <table class="holdings-table">
          <thead>
            <tr>
              <th style="width:60px">계좌</th>
              <th style="min-width:110px">종목명</th>
              <th style="width:70px">유형</th>
              <th style="width:80px">수량</th>
              <th style="width:80px">손익%</th>
              <th style="width:80px">평가금액(만)</th>
              <th style="width:72px">분류</th>
              <th style="width:64px">배지</th>
              <th style="width:30px"></th>
            </tr>
          </thead>
          <tbody id="holdings-tbody-${mi}">${rows}</tbody>
        </table>
      </div>
      <button class="add-row-btn" onclick="addHolding(${mi})">+ 종목 추가</button>
      <div class="member-subtotal">합계 <strong id="msubtotal-${mi}">0</strong><span style="font-size:11px;color:var(--muted)">만원</span></div>
    </div>
  `;
  container.appendChild(div);
}

function buildHoldingRow(mi,hi,h){
  const pnlClass = String(h.pnl).startsWith('-')?'pnl-neg':'pnl-pos';
  const catOpts = CATEGORIES.map(c=>`<option value="${c.id}"${h.cat===c.id?' selected':''}>${c.label}</option>`).join('');
  const badgeOpts = BADGE_OPTIONS.map(b=>`<option value="${escH(b.v)}"${h.badge===b.v?' selected':''}>${b.l}</option>`).join('');
  const entryOpts = ENTRY_TYPES.map(t=>`<option value="${t.v}"${h.entryType===t.v?' selected':''}>${t.l}</option>`).join('');
  return `<tr id="hrow-${mi}-${hi}">
    <td><input value="${escH(h.account)}" placeholder="일반" oninput="updateH(${mi},${hi},'account',this.value)"></td>
    <td><input value="${escH(h.ticker)}" placeholder="GOOGL" style="font-weight:700" oninput="updateH(${mi},${hi},'ticker',this.value)"></td>
    <td><select onchange="updateH(${mi},${hi},'entryType',this.value)">${entryOpts}</select></td>
    <td><input value="${escH(h.qty)}" placeholder="10주" oninput="updateH(${mi},${hi},'qty',this.value)"></td>
    <td><input class="pnl-input ${pnlClass}" value="${escH(h.pnl)}" placeholder="+5.3%" oninput="onPnlInput(${mi},${hi},this)"></td>
    <td><input class="amount-input" type="number" value="${h.amount||''}" min="0" step="1" placeholder="0" oninput="updateHNum(${mi},${hi},'amount',this.value)"></td>
    <td><select onchange="updateH(${mi},${hi},'cat',this.value)">${catOpts}</select></td>
    <td><select onchange="updateH(${mi},${hi},'badge',this.value)">${badgeOpts}</select></td>
    <td>
      <button class="row-btn copy" title="행 복사" onclick="copyHolding(${mi},${hi})">⧉</button>
      <button class="row-btn" title="행 삭제" onclick="removeHolding(${mi},${hi})">✕</button>
    </td>
  </tr>`;
}

function toggleMember(mi){
  const card = document.getElementById('member-card-'+mi);
  if(card) card.classList.toggle('collapsed');
}

function updateH(mi,hi,key,val){
  if(!state.members[mi]||!state.members[mi].holdings[hi]) return;
  state.members[mi].holdings[hi][key]=val;
  markDirty();
  if(key==='amount') recalcSubtotals();
}

function updateHNum(mi,hi,key,val){
  if(!state.members[mi]||!state.members[mi].holdings[hi]) return;
  state.members[mi].holdings[hi][key]=toNum(val);
  recalcSubtotals();
  markDirty();
}

function onPnlInput(mi,hi,el){
  const v=el.value;
  el.className='pnl-input '+(v.startsWith('-')?'pnl-neg':'pnl-pos');
  updateH(mi,hi,'pnl',v);
}

function addHolding(mi){
  const newH={account:'',ticker:'',entryType:'single',qty:'',pnl:'',amount:0,cat:'other',badge:'',note:''};
  state.members[mi].holdings.push(newH);
  const hi=state.members[mi].holdings.length-1;
  const tbody=document.getElementById('holdings-tbody-'+mi);
  if(tbody){
    tbody.insertAdjacentHTML('beforeend',buildHoldingRow(mi,hi,newH));
    // 새 행의 ticker 인풋에 포커스
    const newRow=tbody.lastElementChild;
    const ti=newRow.querySelectorAll('input')[1];
    if(ti) ti.focus();
  }
  recalcSubtotals();
  markDirty();
}

function removeHolding(mi,hi){
  state.members[mi].holdings.splice(hi,1);
  const tbody=document.getElementById('holdings-tbody-'+mi);
  if(tbody){
    tbody.innerHTML=state.members[mi].holdings.map((h,i)=>buildHoldingRow(mi,i,h)).join('');
  }
  recalcSubtotals();
  markDirty();
}

function copyHolding(mi,hi){
  const clone={...state.members[mi].holdings[hi]};
  state.members[mi].holdings.splice(hi+1,0,clone);
  const tbody=document.getElementById('holdings-tbody-'+mi);
  if(tbody){
    tbody.innerHTML=state.members[mi].holdings.map((h,i)=>buildHoldingRow(mi,i,h)).join('');
  }
  recalcSubtotals();
  markDirty();
}

function recalcSubtotals(){
  state.members.forEach((m,mi)=>{
    const total=m.holdings.reduce((s,h)=>s+toNum(h.amount),0);
    const el=document.getElementById('mtotal-'+mi);
    const sel=document.getElementById('msubtotal-'+mi);
    if(el) el.innerHTML=`${fmt(total)}<span class="unit">만원</span>`;
    if(sel) sel.textContent=fmt(total);
  });
}

//  탭2 — 현황 확인 렌더링
// ════════════════════════════════════════════════════════
function renderStatusTab(){
  const container = document.getElementById('statusContent');
  if(!container) return;

  const calc = calcState();
  const {grandTotal, memberTotals, tickerList, catTotals, catPcts} = calc;

  // 직전 스냅샷 (비교용): TREND_KEY에서 현재 기준일 제외 최신 1건
  const allSnaps = loadTrendSnapshots();
  const curYm = normalizeDateKey(state.meta.date||'');
  const prevSnap = allSnaps.filter(s=>s.ym<curYm).slice(-1)[0]||null;

  const totalDiff = prevSnap ? grandTotal - prevSnap.grandTotal : null;
  const totalDiffPct = prevSnap&&prevSnap.grandTotal>0 ? totalDiff/prevSnap.grandTotal*100 : null;

  const changeBadge = (diff)=>{
    if(diff===null) return '<span class="change-badge flat">— 비교 기록 없음</span>';
    const cls = diff>0?'up':diff<0?'down':'flat';
    const arrow = diff>0?'▲':diff<0?'▼':'—';
    return `<span class="change-badge ${cls}">${arrow} ${fmtSign(diff)}만원 (${diff>=0?'+':''}${totalDiffPct.toFixed(2)}%)</span>`;
  };

  const prevLabel = prevSnap ? prevSnap.label+' 대비' : '';

  // 구성원별 변화
  const memberCards = state.members.map((m,mi)=>{
    const total=memberTotals[mi];
    const prevMember = prevSnap?.members?.find(pm=>pm.name===m.name);
    const diff=prevMember?total-prevMember.total:null;
    const diffCls=diff===null?'flat':diff>0?'up':diff<0?'down':'flat';
    const diffTxt=diff===null?'—':((diff>=0?'+':'')+fmt(diff)+'만');
    // 가장 큰 보유 종목
    const topH=[...m.holdings].filter(h=>h.entryType!=='cash').sort((a,b)=>toNum(b.amount)-toNum(a.amount))[0];
    const topTicker=topH?topH.ticker:'—';
    return `<div class="stat-card" style="border-left:3px solid ${m.color}">
      <div class="stat-card-header">
        <span class="stat-card-icon">${escH(m.icon)}</span>
        <span class="stat-card-name">${escH(m.name)}</span>
      </div>
      <div class="stat-card-amount">${fmt(total)}<span class="unit">만</span></div>
      <div class="stat-card-change ${diffCls}">${diff!==null?(diff>=0?'▲':'▼'):''} ${diffTxt}</div>
      <div class="stat-card-top">최대보유: ${escH(topTicker)}</div>
    </div>`;
  }).join('');

  // 종목 순위 TOP10
  const top10 = tickerList.slice(0,10);
  const maxAmt = top10[0]?.amount||1;
  const tickerRows = top10.map((t,i)=>{
    const barW = Math.max(4, t.amount/maxAmt*100);
    // 직전 스냅샷 비교
    const prevAmt = prevSnap?.tickers?.[t.ticker]||0;
    const diff = prevSnap ? t.amount-prevAmt : null;
    const diffStr = diff!==null?(diff>=0?'+':'')+fmt(diff)+'만':'';
    const diffCls = diff===null?'':diff>=0?'up':'down';
    return `<div class="ticker-row">
      <span class="ticker-rank">${i+1}</span>
      <span class="ticker-name">${escH(t.ticker)}</span>
      <div class="ticker-bar-wrap"><div class="ticker-bar" style="width:${barW.toFixed(1)}%"></div></div>
      <span class="ticker-amount">${fmt(t.amount)}만</span>
      <span class="ticker-pct">${t.pct.toFixed(1)}%</span>
      ${diff!==null?`<span class="stat-card-change ${diffCls}" style="width:70px;text-align:right;font-size:10px">${diffStr}</span>`:''}
    </div>
    <div class="ticker-owners" style="padding-left:26px">${t.members.join(' · ')}</div>`;
  }).join('');

  // 자산 분류 바
  const catBars = CATEGORIES.filter(c=>catTotals[c.id]>0).map(c=>{
    const pct=catPcts[c.id];
    return `<div class="cat-bar-row">
      <span class="cat-bar-label">${c.label}</span>
      <div class="cat-bar-wrap"><div class="cat-bar-fill" style="width:${Math.max(1,pct).toFixed(1)}%;background:${c.color}"></div></div>
      <span class="cat-bar-pct">${pct.toFixed(1)}%</span>
      <span class="cat-bar-amt">${fmt(catTotals[c.id])}만</span>
    </div>`;
  }).join('');

  container.innerHTML=`
    <!-- 총자산 배너 -->
    <div class="summary-banner">
      <div class="banner-total">
        <div class="banner-label">가족 전체 평가금액</div>
        <div class="banner-amount">${fmt(grandTotal)}<span class="unit">만원</span></div>
        <div class="banner-change">
          ${changeBadge(totalDiff)}
          ${prevLabel?`<span class="banner-meta">${prevLabel}</span>`:''}
        </div>
      </div>
      <div style="text-align:right">
        <div class="banner-label">기준일</div>
        <div style="font-family:var(--font-mono);font-size:15px;font-weight:700">${state.meta.date||'—'}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">${state.members.length}명 · ${state.members.reduce((s,m)=>s+m.holdings.length,0)}개 포지션</div>
      </div>
    </div>

    <!-- 구성원별 카드 -->
    <div class="sec-label">👤 가족별 현황</div>
    <div class="member-cards-grid">${memberCards}</div>

    <!-- 종목 순위 -->
    <div class="card">
      <div class="card-head"><h3>📊 가족 합산 종목 순위 TOP10</h3><span style="font-size:11px;color:var(--muted)">현금 제외</span></div>
      <div class="card-body">
        <div class="ticker-chart">${tickerRows||'<div style="color:var(--muted);font-size:12px">종목이 없습니다</div>'}</div>
      </div>
    </div>

    <!-- 자산 분류 -->
    <div class="card">
      <div class="card-head"><h3>🗂 자산 분류 비중</h3></div>
      <div class="card-body">${catBars||'<div style="color:var(--muted);font-size:12px">데이터 없음</div>'}</div>
    </div>
  `;
}

function renderHistoryTab(){
  const container = document.getElementById('historyContent');
  if(!container) return;

  const snaps = loadTrendSnapshots();
  const gsUrl = getGSUrl();

  // 구글시트 패널
  const gsPanelHtml=`
    <div class="gs-panel">
      <div class="sec-label">🧾 구글시트 연동</div>
      <div class="gs-url-row">
        <input type="text" id="gsUrlInput" value="${escH(gsUrl)}" placeholder="Apps Script 배포 URL을 붙여넣으세요">
        <button class="btn btn-secondary" onclick="saveGSUrl()">저장</button>
      </div>
      <div class="gs-status" id="gsStatus">${gsUrl?'✅ URL 설정됨 — '+gsUrl.slice(0,50)+'...':'⚠ URL 미설정'}</div>
      <div class="gs-btns">
        <button class="btn btn-secondary" onclick="loadFromGoogleSheet(50)">📥 최근 50건 불러오기</button>
        <button class="btn btn-secondary" onclick="syncAllToGS()">📤 전체 업로드</button>
      </div>
    </div>`;

  if(!snaps.length){
    container.innerHTML=gsPanelHtml+`
      <div style="text-align:center;padding:40px 16px;">
        <div style="font-size:32px;margin-bottom:12px">📈</div>
        <div style="font-size:14px;font-weight:700;margin-bottom:8px">기록이 없습니다</div>
        <div style="font-size:12px;color:var(--muted)">이번 주 입력 후 "📸 이번 주 저장"을 누르면 기록이 시작됩니다.</div>
      </div>`;
    return;
  }

  // 꺾은선 그래프 (SVG)
  const chartHtml = buildTrendChart(snaps);

  // 기록 목록
  const rows = [...snaps].reverse().map(s=>{
    const idx = snaps.findIndex(x=>x.ym===s.ym);
    const prev = idx>0?snaps[idx-1]:null;
    const diff = prev?s.grandTotal-prev.grandTotal:null;
    const diffStr = diff===null?'—':(diff>=0?'▲ +':'▼ ')+fmt(Math.abs(diff))+'만';
    const diffCls = diff===null?'flat':diff>0?'up':'down';
    return `<div class="trend-row">
      <span class="trend-date">${s.label}</span>
      <span class="trend-total">${fmt(s.grandTotal)}만원</span>
      <span class="trend-change ${diffCls}">${diffStr}</span>
      <button class="trend-del" onclick="deleteTrendSnap('${s.ym}')" title="삭제">✕</button>
    </div>`;
  }).join('');

  container.innerHTML=gsPanelHtml+`
    <div class="card">
      <div class="card-head"><h3>📈 총자산 추이 (${snaps.length}주)</h3></div>
      <div class="card-body">${chartHtml}</div>
    </div>
    <div class="card">
      <div class="card-head"><h3>📋 기록 목록</h3><span style="font-size:11px;color:var(--muted)">최근순</span></div>
      <div class="card-body" style="padding:0 14px">${rows}</div>
    </div>`;
}

function buildTrendChart(snaps){
  if(snaps.length<2) return '<div style="color:var(--muted);font-size:12px;text-align:center;padding:20px">기록이 2개 이상 있으면 그래프가 표시됩니다</div>';
  const W=600,H=160,PAD={t:16,r:16,b:32,l:56};
  const vals=snaps.map(s=>s.grandTotal);
  const minV=Math.min(...vals),maxV=Math.max(...vals);
  const range=maxV-minV||1;
  const toX=i=>PAD.l+(i/(snaps.length-1))*(W-PAD.l-PAD.r);
  const toY=v=>PAD.t+(1-(v-minV)/range)*(H-PAD.t-PAD.b);
  const pts=snaps.map((s,i)=>`${toX(i).toFixed(1)},${toY(s.grandTotal).toFixed(1)}`).join(' ');
  // 구간 채우기
  const areaBase=H-PAD.b;
  const areaPts=`${toX(0).toFixed(1)},${areaBase} `+pts+` ${toX(snaps.length-1).toFixed(1)},${areaBase}`;
  // x축 레이블 (최대 6개)
  const step=Math.ceil(snaps.length/6);
  const xlabels=snaps.filter((_,i)=>i%step===0||i===snaps.length-1).map((s,_,arr)=>{
    const i=snaps.indexOf(s);
    const lbl=s.label.slice(5);// MM.DD
    return `<text x="${toX(i).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9" fill="#6b7f90">${lbl}</text>`;
  }).join('');
  // 닷 포인트
  const dots=snaps.map((s,i)=>`<circle cx="${toX(i).toFixed(1)}" cy="${toY(s.grandTotal).toFixed(1)}" r="3" fill="var(--blue)" stroke="var(--s1)" stroke-width="1.5">
    <title>${s.label}: ${fmt(s.grandTotal)}만원</title></circle>`).join('');

  return `<svg class="trend-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3b82f6" stop-opacity=".25"/>
        <stop offset="100%" stop-color="#3b82f6" stop-opacity=".03"/>
      </linearGradient>
    </defs>
    <polygon points="${areaPts}" fill="url(#trendGrad)"/>
    <polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>
    ${dots}
    ${xlabels}
    <text x="${PAD.l-4}" y="${toY(maxV).toFixed(1)}" text-anchor="end" font-size="9" fill="#6b7f90">${fmt(maxV)}만</text>
    <text x="${PAD.l-4}" y="${toY(minV).toFixed(1)}" text-anchor="end" font-size="9" fill="#6b7f90">${fmt(minV)}만</text>
  </svg>`;
}

function deleteTrendSnap(ym){
  const snaps=loadTrendSnapshots();
  const target=snaps.find(s=>s.ym===ym);
  if(!confirm((target?.label||ym)+' 기록을 삭제할까요?')) return;
  const filtered=snaps.filter(s=>s.ym!==ym);
  localStorage.setItem(TREND_KEY,JSON.stringify(filtered));
  showToast('🗑 삭제 완료');
  renderHistoryTab();
}

function saveGSUrl(){
  const v=(document.getElementById('gsUrlInput')?.value||'').trim();
  setGSUrl(v);
  const st=document.getElementById('gsStatus');
  if(st) st.textContent=v?'✅ URL 저장됨 — '+v.slice(0,50)+'...':'⚠ URL 비어있음';
  showToast(v?'✅ 구글시트 URL 저장됨':'⚠ URL을 입력해주세요');
}

function openGSPanel(){ switchTab('history',document.querySelectorAll('.tab-btn')[2]); }

function syncAllToGS(){
  const snaps=loadTrendSnapshots();
  if(!snaps.length){ showToast('업로드할 기록이 없습니다'); return; }
  postToGoogleSheet({mode:'bulk',snapshots:snaps});
  showToast('📤 전체 '+snaps.length+'건 구글시트 업로드 중...');
}

function generateReport(){
  const calc = calcState();
  if(calc.grandTotal === 0){
    showToast('❌ 보유 종목 데이터가 없습니다. 탭1에서 입력 후 시도해주세요.');
    return;
  }
  if(!state.meta.date){
    showToast('❌ 기준일을 먼저 입력해주세요.');
    return;
  }

  // 직전 스냅샷 (비교용)
  const allSnaps = loadTrendSnapshots();
  const curYm = normalizeDateKey(state.meta.date);
  const prevSnap = allSnaps.filter(s => s.ym < curYm).slice(-1)[0] || null;

  const html = buildReportHTML(calc, prevSnap);

  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const ymd = state.meta.date.replace(/\./g, '');
  a.download = '뀨가족보고서_' + ymd + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  showToast('✅ 보고서 생성 완료 — 뀨가족보고서_' + ymd + '.html');
}

function rEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function rFmt(n){ return Math.round(n).toLocaleString('ko-KR'); }
function rSign(n){ const r=Math.round(n); return (r>=0?'+':'')+r.toLocaleString('ko-KR'); }
function rPct(n){ return (n>=0?'+':'')+n.toFixed(2)+'%'; }

function buildReportHTML(calc, prevSnap){
  const { grandTotal, memberTotals, tickerList, catTotals, catPcts } = calc;

  // ── 총자산 변화 ──
  const totalDiff   = prevSnap ? grandTotal - prevSnap.grandTotal : null;
  const totalDiffPct= (prevSnap && prevSnap.grandTotal > 0) ? totalDiff / prevSnap.grandTotal * 100 : null;
  const netDiff     = (totalDiff !== null) ? totalDiff - toNum(state.meta.weeklyBuy) + toNum(state.meta.weeklySell) : null;

  // ── 구성원별 변화 ──
  const memberDeltas = state.members.map((m, mi) => {
    const prev = prevSnap?.members?.find(pm => pm.name === m.name);
    const diff = prev ? memberTotals[mi] - prev.total : null;
    const topH = [...m.holdings].filter(h => h.entryType !== 'cash').sort((a,b)=>toNum(b.amount)-toNum(a.amount))[0];
    return { ...m, total: memberTotals[mi], diff, topTicker: topH?.ticker || '—' };
  });

  // ── 행동 지침 ──
  const actions = (state.meta.actions || []).filter(a => a.trim());

  // ── TOP10 종목 ──
  const top10 = tickerList.slice(0, 10);
  const maxAmt = top10[0]?.amount || 1;

  // ── 카테고리 (0 제외) ──
  const CATS_R = [
    { id:'core',     label:'코어 ETF',      color:'#3b82f6' },
    { id:'bigtech',  label:'빅테크·플랫폼', color:'#8b5cf6' },
    { id:'ai',       label:'AI·반도체',     color:'#ef4444' },
    { id:'semi',     label:'반도체 ETF',    color:'#f59e0b' },
    { id:'defense',  label:'방어·현금',     color:'#10b981' },
    { id:'growth',   label:'성장·테마',     color:'#f97316' },
    { id:'domestic', label:'국내·기타ETF',  color:'#06b6d4' },
    { id:'other',    label:'기타',          color:'#94a3b8' },
  ];
  const activeCats = CATS_R.filter(c => catTotals[c.id] > 0);

  // ── 색상 헬퍼 ──
  const upColor   = '#10b981';
  const downColor = '#ef4444';
  const flatColor = '#94a3b8';
  function diffColor(v){ return v === null ? flatColor : v > 0 ? upColor : v < 0 ? downColor : flatColor; }
  function diffArrow(v){ return v === null ? '—' : v > 0 ? '▲' : v < 0 ? '▼' : '—'; }

  // ──────────────────────────────────────────
  //  섹션 1: 헤더
  // ──────────────────────────────────────────
  const sec1 = `
  <section class="s-header">
    <div class="report-brand">뀨 가족 포트폴리오</div>
    <div class="report-date">${rEsc(state.meta.date)} 기준</div>
    <div class="total-amount">${rFmt(grandTotal)}<span class="unit">만원</span></div>
    ${totalDiff !== null ? `
    <div class="total-change" style="color:${diffColor(totalDiff)}">
      ${diffArrow(totalDiff)} ${rSign(totalDiff)}만원
      <span class="change-pct">(${rPct(totalDiffPct)})</span>
      <span class="change-ref">${prevSnap?.label || ''} 대비</span>
    </div>
    ${netDiff !== null && (toNum(state.meta.weeklyBuy) > 0 || toNum(state.meta.weeklySell) > 0) ? `
    <div class="net-change">
      순수익 변화 ${rSign(netDiff)}만원
      <span style="font-size:11px;color:#94a3b8">(추가매수 ${rFmt(toNum(state.meta.weeklyBuy))}만 / 매도 ${rFmt(toNum(state.meta.weeklySell))}만 제외)</span>
    </div>` : ''}
    ` : '<div class="total-change" style="color:#94a3b8">— 비교 기록 없음</div>'}
  </section>`;

  // ──────────────────────────────────────────
  //  섹션 2: 한 줄 결론 + 행동 지침
  // ──────────────────────────────────────────
  const memo = (state.meta.weeklyMemo || '').trim();
  const sec2 = `
  <section class="s-memo">
    <div class="sec-title">💬 이번 주 한마디</div>
    ${memo
      ? `<div class="memo-text">${rEsc(memo)}</div>`
      : `<div class="memo-text" style="color:#94a3b8;font-style:italic">메모 없음</div>`}
    ${actions.length ? `
    <div class="actions-label">이번 주 체크리스트</div>
    <ul class="actions-list">
      ${actions.map(a => `<li>${rEsc(a)}</li>`).join('')}
    </ul>` : ''}
  </section>`;

  // ──────────────────────────────────────────
  //  섹션 3: 가족별 현황
  // ──────────────────────────────────────────
  const memberCardsHtml = memberDeltas.map(m => {
    const dc = diffColor(m.diff);
    const da = diffArrow(m.diff);
    return `
    <div class="member-card" style="border-top:3px solid ${rEsc(m.color)}">
      <div class="mc-head">
        <span class="mc-icon">${rEsc(m.icon)}</span>
        <span class="mc-name">${rEsc(m.name)}</span>
      </div>
      <div class="mc-total">${rFmt(m.total)}<span class="mc-unit">만원</span></div>
      <div class="mc-diff" style="color:${dc}">
        ${m.diff !== null ? `${da} ${rSign(m.diff)}만원` : '— 비교 없음'}
      </div>
      <div class="mc-top">최대보유 <strong>${rEsc(m.topTicker)}</strong></div>
    </div>`;
  }).join('');

  const sec3 = `
  <section class="s-members">
    <div class="sec-title">👨‍👩‍👧‍👦 가족별 현황</div>
    <div class="members-grid">${memberCardsHtml}</div>
  </section>`;

  // ──────────────────────────────────────────
  //  섹션 4: 종목 순위 TOP10 (SVG 막대)
  // ──────────────────────────────────────────
  const BAR_W = 480;
  const BAR_ROW_H = 32;
  const svgH = top10.length * BAR_ROW_H + 10;
  const LABEL_W = 90;
  const AMT_W   = 70;
  const BAR_AREA = BAR_W - LABEL_W - AMT_W - 16;

  const barRows = top10.map((t, i) => {
    const y = i * BAR_ROW_H + 6;
    const bw = Math.max(4, (t.amount / maxAmt) * BAR_AREA);
    const prevAmt = prevSnap?.tickers?.[t.ticker] || 0;
    const diff = prevSnap ? t.amount - prevAmt : null;
    const dc = diffColor(diff);
    const diffLabel = diff !== null ? (diff >= 0 ? '+' : '') + rFmt(diff) + '만' : '';
    return `
      <text x="${LABEL_W - 4}" y="${y + 13}" text-anchor="end" font-size="12" font-weight="700" fill="#1e293b">${rEsc(t.ticker)}</text>
      <text x="${LABEL_W - 4}" y="${y + 24}" text-anchor="end" font-size="9" fill="#94a3b8">${rEsc(t.members.join('·'))}</text>
      <rect x="${LABEL_W}" y="${y + 4}" width="${bw.toFixed(1)}" height="14" rx="3" fill="#3b82f6" opacity="0.85"/>
      <text x="${LABEL_W + bw + 5}" y="${y + 15}" font-size="11" font-family="monospace" fill="#475569">${rFmt(t.amount)}만</text>
      <text x="${LABEL_W + bw + 5}" y="${y + 26}" font-size="9" font-family="monospace" fill="${dc}">${diffLabel}</text>
    `;
  }).join('');

  const sec4 = `
  <section class="s-tickers">
    <div class="sec-title">📊 가족 합산 종목 순위 TOP${top10.length}</div>
    ${top10.length
      ? `<div style="overflow-x:auto">
          <svg viewBox="0 0 ${BAR_W} ${svgH}" width="100%" xmlns="http://www.w3.org/2000/svg"
               style="max-width:${BAR_W}px;display:block;margin:0 auto;">
            ${barRows}
          </svg>
         </div>`
      : '<p style="color:#94a3b8;font-size:13px">데이터 없음</p>'}
  </section>`;

  // ──────────────────────────────────────────
  //  섹션 5: 자산 분류 비중
  // ──────────────────────────────────────────
  const catRowsHtml = activeCats.map(c => `
    <div class="cat-row">
      <span class="cat-label">${rEsc(c.label)}</span>
      <div class="cat-bar-wrap">
        <div class="cat-bar-fill" style="width:${Math.max(1, catPcts[c.id]).toFixed(1)}%;background:${c.color}"></div>
      </div>
      <span class="cat-pct">${catPcts[c.id].toFixed(1)}%</span>
      <span class="cat-amt">${rFmt(catTotals[c.id])}만</span>
    </div>`).join('');

  const sec5 = `
  <section class="s-cats">
    <div class="sec-title">🗂 자산 분류 비중</div>
    ${catRowsHtml || '<p style="color:#94a3b8;font-size:13px">데이터 없음</p>'}
  </section>`;

  // ──────────────────────────────────────────
  //  CSS (self-contained, 모바일 우선)
  // ──────────────────────────────────────────
  const css = `
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{font-size:15px;}
    body{
      font-family:'Noto Sans KR',sans-serif;
      background:#f0f4f8;color:#1e293b;
      line-height:1.6;min-height:100vh;
    }
    .report-wrap{
      max-width:480px;margin:0 auto;
      background:#fff;min-height:100vh;
    }
    section{padding:20px 18px;border-bottom:1px solid #e2e8f0;}

    /* 헤더 */
    .s-header{
      background:linear-gradient(135deg,#1e3a5f 0%,#0f2442 100%);
      color:#fff;text-align:center;padding:28px 18px 24px;
    }
    .report-brand{font-size:11px;font-weight:700;letter-spacing:2px;color:#93c5fd;text-transform:uppercase;margin-bottom:6px;}
    .report-date{font-size:12px;color:#93c5fd;margin-bottom:16px;}
    .total-amount{font-size:36px;font-weight:900;letter-spacing:-1px;line-height:1.1;}
    .unit{font-size:16px;font-weight:400;color:#93c5fd;margin-left:4px;}
    .total-change{font-size:17px;font-weight:700;margin-top:10px;}
    .change-pct{font-size:13px;opacity:.85;margin-left:4px;}
    .change-ref{font-size:11px;color:#93c5fd;margin-left:6px;}
    .net-change{font-size:12px;color:#93c5fd;margin-top:6px;}

    /* 섹션 타이틀 */
    .sec-title{font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;
               letter-spacing:.5px;margin-bottom:14px;}

    /* 메모 */
    .s-memo{background:#fffbf0;}
    .memo-text{
      font-size:15px;font-weight:500;color:#1e293b;
      background:#fef9c3;border-left:4px solid #f59e0b;
      border-radius:0 8px 8px 0;padding:12px 14px;
      line-height:1.7;margin-bottom:14px;
    }
    .actions-label{font-size:11px;font-weight:700;color:#64748b;margin-bottom:8px;}
    .actions-list{list-style:none;padding:0;}
    .actions-list li{
      display:flex;align-items:flex-start;gap:10px;
      padding:8px 12px;background:#f8fafc;border-radius:8px;
      margin-bottom:6px;font-size:13px;color:#334155;
      border:1px solid #e2e8f0;
    }
    .actions-list li::before{
      content:'✓';font-size:13px;font-weight:900;
      color:#10b981;flex-shrink:0;margin-top:1px;
    }

    /* 가족 카드 */
    .members-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .member-card{
      border-radius:10px;padding:14px 12px;background:#f8fafc;
      border:1px solid #e2e8f0;
    }
    .mc-head{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
    .mc-icon{font-size:18px;}
    .mc-name{font-size:13px;font-weight:700;color:#1e293b;}
    .mc-total{font-size:20px;font-weight:900;color:#1e293b;line-height:1.1;}
    .mc-unit{font-size:11px;font-weight:400;color:#94a3b8;margin-left:2px;}
    .mc-diff{font-size:12px;font-weight:700;margin-top:4px;}
    .mc-top{font-size:10px;color:#94a3b8;margin-top:6px;}
    .mc-top strong{color:#64748b;}

    /* 종목 순위 */
    .s-tickers{background:#fff;}

    /* 자산 분류 */
    .s-cats{background:#f8fafc;}
    .cat-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
    .cat-label{width:86px;font-size:12px;color:#475569;flex-shrink:0;}
    .cat-bar-wrap{flex:1;height:10px;background:#e2e8f0;border-radius:5px;overflow:hidden;}
    .cat-bar-fill{height:100%;border-radius:5px;transition:width .4s;}
    .cat-pct{width:36px;text-align:right;font-size:11px;font-family:monospace;color:#64748b;flex-shrink:0;}
    .cat-amt{width:56px;text-align:right;font-size:11px;font-family:monospace;color:#94a3b8;flex-shrink:0;}

    /* 푸터 */
    .s-footer{
      background:#f8fafc;text-align:center;padding:20px 18px;
      font-size:11px;color:#94a3b8;line-height:2;
    }
    @media print{
      body{background:#fff;}
      .report-wrap{max-width:100%;}
    }
  `;

  // ──────────────────────────────────────────
  //  최종 HTML 조립
  // ──────────────────────────────────────────
  return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>뀨 가족 보고서 — ${rEsc(state.meta.date)}</title>
<style>${css}</style>
</head>
<body>
<div class="report-wrap">
  ${sec1}
  ${sec2}
  ${sec3}
  ${sec4}
  ${sec5}
  <section class="s-footer">
    <div>뀨 가족 포트폴리오 주간 보고서</div>
    <div>기준일: ${rEsc(state.meta.date)} · 생성: ${new Date().toLocaleString('ko-KR')}</div>
    <div style="margin-top:4px;font-size:10px">이 보고서는 참고용이며 투자 권유가 아닙니다</div>
  </section>
</div>
</body>
</html>`;
}

// ════════════════════════════════════════════════════════
//  토스트
// ════════════════════════════════════════════════════════
let _toastTimer;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove('show'),3000);
}

// ════════════════════════════════════════════════════════
//  초기화 & 부트스트랩
// ════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded',()=>{
  // 기존 저장 데이터 복원
  restoreSavedState();
  restoreSavedSnapshot();

  // 기준일이 비어있으면 오늘 날짜로
  if(!state.meta.date){
    const today=new Date();
    const ymd=`${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
    state.meta.date=ymd;
  }

  syncMetaInputs();
  renderMembers();
  markClean();
});

// 페이지 떠날 때 저장
window.addEventListener('beforeunload',()=>{ if(_dirty) saveStateNow(); });

// ════════════════════════════════════════════════════════
//  Service Worker 등록 (PWA)
// ════════════════════════════════════════════════════════
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js')
      .then(reg=>{ console.log('[SW] 등록 완료:', reg.scope); })
      .catch(err=>{ console.warn('[SW] 등록 실패:', err); });
  });
}
</script>
</body>
</html>
